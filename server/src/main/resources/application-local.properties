# Vite dev server (frontend/) — explicit origins required for session cookies cross-port on localhost.
app.cors.enabled=true
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.cors.allow-credentials=true
app.cors.max-age-sec=3600

orion.api-base-url=http://localhost:1026/ngsi-ld/v1
orion.health-url=http://localhost:1026/version
# Orion runs in Docker and must resolve the context URL from inside its network.
# localhost:3004 is reachable from the host Server process, but Orion cannot fetch it
# (LdContextNotAvailable → HTTP 503). Use host.docker.internal for host-published :3004.
orion.context-url=http://host.docker.internal:3004/datamodels.context-ngsi.jsonld

app.control-api.base-url=http://localhost:9090
# Scenario apply waits for TraCI drain (up to ~15s); keep proxy timeout above that.
app.control-api.timeout-ms=20000
app.context-provider.health-url=http://localhost:3004/datamodels.context-ngsi.jsonld
