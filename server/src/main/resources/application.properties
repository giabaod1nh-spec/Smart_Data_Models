spring.application.name=server

# Profile: set via SPRING_PROFILES_ACTIVE=local|docker (do not hard-code here)

spring.datasource.url=jdbc:postgresql://localhost:5432/traffic
spring.datasource.username=erp_user
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update

app.security.admin.username=admin
app.security.admin.password=admin123

orion.timeout-ms=5000
app.control-api.timeout-ms=5000
app.control-api.max-body-bytes=65536

app.realtime.consistency-retry-ms=150
app.realtime.simulation-time-tolerance=0.0001
app.realtime.freshness-threshold-sec=2.0

projector.base-url=http://localhost:8093

app.control.command-domain-enabled=false
app.control.observation-confirmation-enabled=false
app.control.compatibility-adapters-enabled=true
app.control-api.internal-token=

app.analytics.enabled=false
app.analytics.network-overview-enabled=false
app.analytics.max-simulation-range-sec=86400
app.analytics.clickhouse.host=localhost
app.analytics.clickhouse.port=8123
app.analytics.clickhouse.database=smart_traffic
app.analytics.clickhouse.user=default
app.analytics.clickhouse.password=
app.analytics.clickhouse.connect-timeout-ms=3000
app.analytics.clickhouse.query-timeout-ms=10000
app.analytics.clickhouse.read-only=true
app.analytics.definition.version=v1.0
app.analytics.definition.major=1
app.analytics.definition.minor=0
