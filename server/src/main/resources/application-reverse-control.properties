# Reverse-control runtime acceptance profile (RC8-T1)
# Activate: SPRING_PROFILES_ACTIVE=local,reverse-control

app.control.command-domain-enabled=true
app.control.observation-confirmation-enabled=true
app.control.compatibility-adapters-enabled=true
app.control.reconciliation-interval-ms=3000
app.control.observation-interval-ms=5000
app.control.observation-timeout-sec=45

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.metrics.enabled=true
