spring.datasource.url=jdbc:h2:mem:traffic;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

orion.api-base-url=http://localhost:59999/ngsi-ld/v1
orion.health-url=http://localhost:59999/version
orion.context-url=http://localhost:59999/context.jsonld
orion.timeout-ms=2000

app.control-api.base-url=http://localhost:59998
app.control-api.timeout-ms=2000
app.control-api.max-body-bytes=65536
app.control-api.internal-token=
app.control.command-domain-enabled=true
app.control.observation-confirmation-enabled=false
app.control.compatibility-adapters-enabled=false
app.context-provider.health-url=http://localhost:59997/context.jsonld

app.security.admin.username=admin
app.security.admin.password=admin123
