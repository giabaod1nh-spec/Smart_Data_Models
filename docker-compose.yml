services:
  de-migrate-v1-bronze:
    profiles: ["v1-bronze", "v1-silver"]
    build: {context: ., dockerfile: de/Dockerfile}
    environment: {K4_CLICKHOUSE_HOST: clickhouse}
    depends_on:
      clickhouse: {condition: service_healthy}
    command: ["python", "-m", "de.scripts.migrate_clickhouse", "--v1-bronze"]
    restart: "no"

  de-bronze-v1:
    profiles: ["v1-bronze", "v1-silver"]
    build: {context: ., dockerfile: de/Dockerfile}
    environment:
      DE_BRONZE_CLICKHOUSE_HOST: clickhouse
      DE_BRONZE_RAW_LEDGER_PATH: /raw/ledger.sqlite3
      DE_BRONZE_CHECKPOINT_PATH: /app/de/artifacts/bronze_v1/checkpoint.sqlite3
    volumes:
      - ./de/artifacts/kafka_raw_v1:/raw:ro
      - ./de/artifacts/bronze_v1:/app/de/artifacts/bronze_v1
    ports: ["8098:8098"]
    depends_on:
      de-migrate-v1-bronze: {condition: service_completed_successfully}
    command: ["python", "-m", "de.bronze.main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8098/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  de-migrate-v1-silver:
    profiles: ["v1-silver"]
    build: {context: ., dockerfile: de/Dockerfile}
    environment: {K4_CLICKHOUSE_HOST: clickhouse}
    depends_on:
      de-migrate-v1-bronze: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}
    command: ["python", "-m", "de.scripts.migrate_clickhouse", "--v1-silver"]
    restart: "no"

  de-migrate-v1:
    profiles: ["v1-raw"]
    build:
      context: .
      dockerfile: de/Dockerfile
    environment:
      K4_CLICKHOUSE_HOST: clickhouse
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["python", "-m", "de.scripts.migrate_clickhouse", "--migration", "/app/de/migrations/006_create_kafka_raw_v1.sql"]
    restart: "no"

  de-kafka-raw-v1:
    profiles: ["v1-raw"]
    build:
      context: .
      dockerfile: de/Dockerfile
    environment:
      DE_V1_RAW_BOOTSTRAP_SERVERS: kafka:9092
      DE_V1_RAW_CLICKHOUSE_HOST: clickhouse
      DE_V1_RAW_LEDGER_PATH: /app/de/artifacts/kafka_raw_v1/ledger.sqlite3
    volumes:
      - ./de/artifacts:/app/de/artifacts
    ports:
      - "8097:8097"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      de-migrate-v1:
        condition: service_completed_successfully
    command: ["python", "-m", "de.kafka_raw.v1_main"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8097/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8090:8080"

  mongo-db:
    image: mongo:4.4
    container_name: db-mongos
    restart: always
    command: --nojournal
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  orion:
    # Pinned for RT-DE Contract freeze — do not use :latest
    image: fiware/orion-ld:1.7.1
    container_name: fiware-orion
    restart: always
    depends_on:
      - mongo-db
    ports:
      - "1026:1026"
    command: -dbhost mongo-db -logLevel DEBUG

  mongo-db-v1-replay:
    profiles: ["v1-replay"]
    image: mongo:4.4
    command: --nojournal
    volumes:
      - v1-replay-mongo:/data/db

  orion-v1-replay:
    profiles: ["v1-replay"]
    image: fiware/orion-ld:1.7.1
    depends_on:
      - mongo-db-v1-replay
    command: -dbhost mongo-db-v1-replay -logLevel WARN

  context-server:
    image: httpd:2.4
    container_name: context-provider
    restart: always
    ports:
      - "3004:80"
    volumes:
      - ./context:/usr/local/apache2/htdocs

  # Placeholder for Realtime when containerized: mount shared run packages for DE.
  # Host-side Visualize writes to ./Visualize/artifacts/runs by default.
  # DE services SHOULD mount the same volume at /app/artifacts/runs
  # (see docs/implementation/deployment.md).

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: de-clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./de/clickhouse/users.d/allow-docker-network.xml:/etc/clickhouse-server/users.d/allow-docker-network.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  de-webhook:
    # K-6b rollback asset only. Plain `docker compose up` never creates it.
    profiles: ["rollback"]
    build:
      context: .
      dockerfile: de/Dockerfile
    container_name: de-webhook
    restart: always
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DE_CLICKHOUSE_HOST: clickhouse
      DE_CLICKHOUSE_PORT: "8123"
      DE_CLICKHOUSE_DATABASE: smart_traffic
      DE_CLICKHOUSE_USER: ${ROLLBACK_RAW_V1_CLICKHOUSE_USER:-default}
      DE_CLICKHOUSE_PASSWORD: ${ROLLBACK_RAW_V1_CLICKHOUSE_PASSWORD:-}
      DE_LOG_LEVEL: INFO
      DE_WEBHOOK_ENABLED: "true"
      DE_WEBHOOK_MODE: ROLLBACK_ONLY
    command: ["uvicorn", "de.webhook.main:app", "--host", "0.0.0.0", "--port", "8080"]

  de-migrate:
    build:
      context: .
      dockerfile: de/Dockerfile
    container_name: de-migrate
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      K4_CLICKHOUSE_HOST: clickhouse
      K4_CLICKHOUSE_PORT: "8123"
      K4_CLICKHOUSE_DATABASE: smart_traffic
    command: ["python", "-m", "de.scripts.migrate_clickhouse", "--gold-m1"]
    restart: "no"

  de-kafka-raw-consumer:
    profiles: ["v2-legacy"]
    build:
      context: .
      dockerfile: de/Dockerfile
    container_name: de-kafka-raw-consumer
    restart: unless-stopped
    depends_on:
      de-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8091:8091"
    environment:
      K4_BOOTSTRAP_SERVERS: kafka:9092
      K4_CLICKHOUSE_HOST: clickhouse
      K4_CLICKHOUSE_PORT: "8123"
      K4_CLICKHOUSE_DATABASE: smart_traffic
      K4_CLIENT_ID: raw-consumer-node1
      K4_GROUP_ID: de-kafka-raw-v2
      K4_HEALTH_HOST: 0.0.0.0
      K4_HEALTH_PORT: "8091"
      K4_LEDGER_PATH: /app/de/artifacts/kafka_raw/ledger.sqlite3
    command: ["python", "-m", "de.kafka_raw.main"]
    volumes:
      - ./de/artifacts:/app/de/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  de-bronze-processor:
    profiles: ["v2-legacy"]
    build:
      context: .
      dockerfile: de/Dockerfile
    container_name: de-bronze-processor
    restart: unless-stopped
    deploy:
      replicas: 1
    depends_on:
      de-migrate:
        condition: service_completed_successfully
      de-kafka-raw-consumer:
        condition: service_started
      clickhouse:
        condition: service_healthy
    ports:
      - "8092:8092"
    environment:
      K7_CLICKHOUSE_HOST: clickhouse
      K7_CLICKHOUSE_PORT: "8123"
      K7_CLICKHOUSE_DATABASE: smart_traffic
      K7_HEALTH_HOST: 0.0.0.0
      K7_HEALTH_PORT: "8092"
      K7_CHECKPOINT_PATH: /app/de/artifacts/bronze/checkpoint.sqlite3
      K7_CHECKPOINT_NAMESPACE: live
      K7_SINGLE_INSTANCE: "true"
      K7_WORKER_COUNT: "1"
    command: ["python", "-c", "raise SystemExit('Legacy V2 Bronze entrypoint retired by in-place V1 migration. Historical source: 757060f8175fdb22d9ee27e7f8d175c82c0e2c45. Use de-bronze-v1 for V1 processing; V2 tables remain preserved.')"]
    volumes:
      - ./de/artifacts:/app/de/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  de-silver-processor:
    profiles: ["v1-silver"]
    build:
      context: .
      dockerfile: de/Dockerfile
    container_name: de-silver-processor
    restart: unless-stopped
    depends_on:
      de-migrate-v1-silver:
        condition: service_completed_successfully
      de-bronze-v1:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8095:8095"
    environment:
      SILVER_CLICKHOUSE_HOST: clickhouse
      SILVER_CLICKHOUSE_PORT: "8123"
      SILVER_CLICKHOUSE_DATABASE: smart_traffic
      SILVER_CLICKHOUSE_USER: default
      SILVER_CLICKHOUSE_PASSWORD: ""
      SILVER_CHECKPOINT_PATH: /app/de/artifacts/silver_v1/checkpoint.sqlite3
      SILVER_V1_BRONZE_PATH: /app/de/artifacts/bronze_v1/checkpoint.sqlite3
      SILVER_V1_ARCHIVE_ROOT: /app/Visualize/artifacts
      SILVER_NAMESPACE: live
      SILVER_DESTINATION_MODE: main
      SILVER_REPLAY_RUN_ID: ""
      SILVER_TOPIC_ALLOWLIST: traffic.observations.v1
      SILVER_HEALTH_HOST: 0.0.0.0
      SILVER_HEALTH_PORT: "8095"
      SILVER_BATCH_SIZE: "500"
      SILVER_POLL_INTERVAL_SEC: "2.0"
      SILVER_DISCOVERY_INTERVAL_SEC: "30.0"
      SILVER_READINESS_STALE_SEC: "120.0"
      SILVER_HEALTH_SNAPSHOT_MAX_AGE_SEC: "60.0"
      SILVER_SINGLE_INSTANCE: "true"
      SILVER_WORKER_COUNT: "1"
    command: ["python", "-m", "de.silver.main"]
    volumes:
      - ./de/artifacts/bronze_v1:/app/de/artifacts/bronze_v1:ro
      - ./Visualize/artifacts/runs:/app/Visualize/artifacts/runs:ro
      - ./de/artifacts/silver_v1:/app/de/artifacts/silver_v1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  de-gold-runtime:
    profiles: ["v1-gold"]
    build:
      context: .
      dockerfile: de/Dockerfile
    container_name: de-gold-runtime
    restart: "no"
    depends_on:
      de-silver-processor:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8096:8096"
    environment:
      SILVER_CLICKHOUSE_HOST: clickhouse
      SILVER_CLICKHOUSE_PORT: "8123"
      SILVER_CLICKHOUSE_DATABASE: smart_traffic
      SILVER_CLICKHOUSE_USER: ${GOLD_SOURCE_CLICKHOUSE_USER:-gold_core_reader}
      SILVER_CLICKHOUSE_PASSWORD: ${GOLD_SOURCE_CLICKHOUSE_PASSWORD:-}
      SILVER_CHECKPOINT_PATH: /app/de/artifacts/silver_v1/checkpoint.sqlite3
      SILVER_V1_BRONZE_PATH: /app/de/artifacts/bronze_v1/checkpoint.sqlite3
      SILVER_V1_ARCHIVE_ROOT: /app/Visualize/artifacts
      GOLD_CHECKPOINT_PATH: /app/de/artifacts/gold_v1/checkpoint.sqlite3
      GOLD_INSTANCE_LOCK_PATH: /app/de/artifacts/gold_v1/instance.lock
      GOLD_HEALTH_HOST: 0.0.0.0
      GOLD_HEALTH_PORT: "8096"
    stop_grace_period: 90s
    command: ["python", "-m", "de.gold_runtime.main"]
    volumes:
      - ./de/artifacts/gold_v1:/app/de/artifacts/gold_v1
      - ./de/artifacts/silver_v1:/app/de/artifacts/silver_v1:ro
      - ./de/artifacts/bronze_v1:/app/de/artifacts/bronze_v1:ro
      - ./Visualize/artifacts/runs:/app/Visualize/artifacts/runs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8096/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # ── Kafka (KRaft, local thesis RF=1 — not HA) ───────────────────
  kafka:
    image: apache/kafka:3.8.1
    container_name: smart-traffic-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      # Prefer project path (D:) over Docker Desktop default on C:
      - ./data/kafka:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-init:
    image: apache/kafka:3.8.1
    container_name: smart-traffic-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/kafka-init.sh:/kafka-init.sh:ro
    entrypoint: ["/bin/bash", "/kafka-init.sh"]
    restart: "no"

  orion-projector-v1:
    build:
      context: .
      dockerfile: Visualize/Dockerfile.projector
    container_name: orion-projector-v1
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      orion:
        condition: service_started
    ports:
      - "8094:8092"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      V1_KAFKA_TOPIC: traffic.observations.v1
      V1_PROJECTOR_GROUP: projector-v1-production-cutover
      V1_PROJECTOR_DB: /app/Visualize/artifacts/projector/v1-production.sqlite3
      V1_RUNS_DIR: /app/Visualize/artifacts/runs
      V1_PROJECTOR_HEALTH_PORT: "8092"
      ORION_URL: http://orion:1026
      ORION_TENANT: ${ORION_TENANT:-}
      ORION_FIWARE_SERVICE: ${ORION_FIWARE_SERVICE:-}
      ORION_SERVICE_PATH: ${ORION_SERVICE_PATH:-}
    volumes:
      - ./Visualize/artifacts/runs:/app/Visualize/artifacts/runs:ro
      - v1-projector-data:/app/Visualize/artifacts/projector
    command: ["python", "-m", "tools.v1_projector_consumer"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  v1-projector-data:
  v1-replay-mongo:
  mongo-data:
  shared-run-artifacts:
  clickhouse-data:
